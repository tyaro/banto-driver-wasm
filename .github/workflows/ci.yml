name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep main runs alive for future main-save / PR-restore caches.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sdk: ${{ steps.classify.outputs.sdk }}
      modbus: ${{ steps.classify.outputs.modbus }}
      slmp: ${{ steps.classify.outputs.slmp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test .github/scripts/ci-changes.test.mjs
      - name: List changed files
        id: diff
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git rev-parse --verify -q 'HEAD^2' >/dev/null &&
             git diff --name-only -z --no-renames 'HEAD^1' HEAD > "$RUNNER_TEMP/changed-files"; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            echo '::warning::PR diff unavailable; checking all areas'
          fi
      - name: Classify
        id: classify
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_DIFF_OK: ${{ steps.diff.outputs.ok }}
          CI_CHANGED_FILES: ${{ runner.temp }}/changed-files
        run: node .github/scripts/ci-changes.mjs

  scaffold:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/check-scaffold.mjs

  sdk-guard:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node .github/scripts/check-scaffold.mjs sdk

  modbus-test:
    needs: changes
    if: needs.changes.outputs.modbus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust 1.85.1
        run: rustup toolchain install 1.85.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy -p banto-modbus-read-core --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check -p banto-modbus-read-core --target wasm32-unknown-unknown --locked

  native-compare:
    needs: changes
    if: needs.changes.outputs.modbus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Hub's pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: comparison -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.98.1 fmt --manifest-path comparison/Cargo.toml --check
      - run: cargo +1.98.1 clippy --manifest-path comparison/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.98.1 test --manifest-path comparison/Cargo.toml --locked

  component-build:
    needs: changes
    if: needs.changes.outputs.modbus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Rust 1.98.1 for the component
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: component -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned WIT tooling
        run: cargo +1.98.1 install wasm-tools --version 1.262.0 --locked
      - name: Validate the full driver world
        run: |
          wasm-tools component wit wit/driver.wit --wasm -o "$RUNNER_TEMP/driver-wit.wasm"
          wasm-tools validate "$RUNNER_TEMP/driver-wit.wasm"
      - name: Check prototype manifest
        run: |
          node -e 'const m=require("./component/manifest.json"); if (!Number.isInteger(m.settingsVersion) || m.settingsVersion < 1 || m.hubApi !== "1" || m.transports.join() !== "tcp" || m.capabilities.join() !== "read") process.exit(1)'
      - run: cargo +1.98.1 fmt --manifest-path component/Cargo.toml --check
      - run: cargo +1.98.1 clippy --manifest-path component/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.98.1 test --manifest-path component/Cargo.toml --locked
      - name: Build one WASM component
        run: |
          cargo +1.98.1 build --manifest-path component/Cargo.toml --target wasm32-unknown-unknown --locked
          mkdir -p dist
          wasm-tools component new component/target/wasm32-unknown-unknown/debug/banto_modbus_tcp_component.wasm -o dist/banto-modbus-tcp-component.wasm
          wasm-tools validate dist/banto-modbus-tcp-component.wasm
          wasm-tools component targets wit/driver.wit dist/banto-modbus-tcp-component.wasm --world driver
          wasm-tools component wit dist/banto-modbus-tcp-component.wasm | node -e 'let s=""; process.stdin.on("data", c=>s+=c); process.stdin.on("end",()=>{if(s.includes("wasi:")) process.exit(1)})'
      - uses: actions/upload-artifact@v4
        with:
          name: banto-modbus-tcp-component
          path: dist/banto-modbus-tcp-component.wasm
          if-no-files-found: error

  component-compare:
    needs: [changes, component-build]
    if: needs.changes.outputs.modbus == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: banto-modbus-tcp-component
          path: dist
      - name: Install Hub's pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime-comparison -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.98.1 fmt --manifest-path runtime-comparison/Cargo.toml --check
      - run: cargo +1.98.1 clippy --manifest-path runtime-comparison/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.98.1 test --manifest-path runtime-comparison/Cargo.toml --locked
        env:
          BANTO_COMPONENT_WASM: ${{ github.workspace }}/dist/banto-modbus-tcp-component.wasm

  slmp-test:
    needs: changes
    if: needs.changes.outputs.slmp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: drivers/slmp -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo +1.98.1 fmt --manifest-path drivers/slmp/Cargo.toml --check
      - run: cargo +1.98.1 clippy --manifest-path drivers/slmp/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo +1.98.1 test --manifest-path drivers/slmp/Cargo.toml --locked
      - run: cargo +1.98.1 check --manifest-path drivers/slmp/Cargo.toml --target wasm32-unknown-unknown --locked
      - name: Check the SLMP guest source
        run: |
          cargo +1.98.1 fmt --manifest-path slmp-component/Cargo.toml --check
          cargo +1.98.1 clippy --manifest-path slmp-component/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.98.1 test --manifest-path slmp-component/Cargo.toml --locked
      - name: Install pinned WIT tooling
        run: cargo +1.98.1 install wasm-tools --version 1.262.0 --locked
      - name: Build and validate SLMP component against the existing world
        run: |
          cargo +1.98.1 build --manifest-path slmp-component/Cargo.toml --target wasm32-unknown-unknown --locked
          mkdir -p dist
          wasm-tools component new slmp-component/target/wasm32-unknown-unknown/debug/banto_slmp_read_component.wasm -o dist/banto-slmp-read-component.wasm
          wasm-tools validate dist/banto-slmp-read-component.wasm
          wasm-tools component targets wit/driver.wit dist/banto-slmp-read-component.wasm --world driver
          wasm-tools component targets wit dist/banto-slmp-read-component.wasm --world driver-with-write-v1
          wasm-tools component targets wit dist/banto-slmp-read-component.wasm --world driver-with-diagnostics-v1
          wasm-tools component targets wit dist/banto-slmp-read-component.wasm --world driver-with-write-and-diagnostics-v1
          wasm-tools component wit dist/banto-slmp-read-component.wasm | node -e 'let s=""; process.stdin.on("data", c=>s+=c); process.stdin.on("end",()=>{if(s.includes("wasi:")) process.exit(1)})'
      - name: Run controlled Q/R Wasmtime fixtures
        run: |
          cargo +1.98.1 fmt --manifest-path slmp-runtime/Cargo.toml --check
          cargo +1.98.1 clippy --manifest-path slmp-runtime/Cargo.toml --all-targets --locked -- -D warnings
          cargo +1.98.1 test --manifest-path slmp-runtime/Cargo.toml --locked
        env:
          BANTO_SLMP_COMPONENT_WASM: ${{ github.workspace }}/dist/banto-slmp-read-component.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: banto-slmp-read-component
          path: dist/banto-slmp-read-component.wasm
          if-no-files-found: error

  ci-gate:
    if: always()
    needs: [changes, scaffold, sdk-guard, modbus-test, native-compare, component-build, component-compare, slmp-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e '.changes.result == "success" and .scaffold.result == "success"' <<< "$NEEDS" >/dev/null
          jq -e 'all(.[]; .result != "failure" and .result != "cancelled")' <<< "$NEEDS" >/dev/null
          for area in sdk modbus slmp; do
            job="${area}-guard"
            if [[ "$area" == modbus ]]; then job=modbus-test; fi
            if [[ "$area" == slmp ]]; then job=slmp-test; fi
            wanted=$(jq -r --arg area "$area" '.changes.outputs[$area]' <<< "$NEEDS")
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS")
            if [[ "$wanted" == true && "$result" != success ]]; then
              echo "::error::$job required but $result"
              exit 1
            fi
          done
          wanted=$(jq -r '.changes.outputs.modbus' <<< "$NEEDS")
          result=$(jq -r '."native-compare".result' <<< "$NEEDS")
          if [[ "$wanted" == true && "$result" != success ]]; then
            echo "::error::native-compare required but $result"
            exit 1
          fi
          for job in component-build component-compare; do
            result=$(jq -r --arg job "$job" '.[$job].result' <<< "$NEEDS")
            if [[ "$wanted" == true && "$result" != success ]]; then
              echo "::error::$job required but $result"
              exit 1
            fi
          done
